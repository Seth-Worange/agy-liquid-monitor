<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>AGY Liquid Monitor</title>
  <style>/* CSS */</style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true"><!-- LOGO --></span>
        <div><h1>Liquid Monitor</h1><p data-i18n="Antigravity 用量监控">Antigravity 用量监控</p></div>
      </div>
      <div class="actions">
        <span class="connection" id="connection" aria-live="polite">连接中</span>
        <button class="icon-button" id="appearance" type="button" data-i18n-label="外观设置" data-i18n-title="外观设置" aria-controls="appearance-panel" aria-expanded="false"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"></svg></button>
        <button class="icon-button" id="refresh" data-i18n-label="刷新数据" data-i18n-title="刷新数据"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 7v5h-5M4.8 15.6a8 8 0 0 0 13.3 2.1M19.2 8.4A8 8 0 0 0 5.9 6.3L4 9"/></svg></button>
      </div>
    </header>
    <section class="surface appearance-panel" id="appearance-panel" data-i18n-label="外观设置" hidden></section>
    <nav class="nav" data-i18n-label="监控面板">
      <button data-view="overview" data-i18n="概览" class="selected" aria-current="page">概览</button>
      <button data-view="session" data-i18n="会话">会话</button>
      <button data-view="context" data-i18n="上下文">上下文</button>
      <button data-view="agents" data-i18n="子代理">子代理</button>
      <button data-view="quota" data-i18n="额度">额度</button>
      <button data-view="usage" data-i18n="历史用量">历史用量</button>
    </nav>
    <main id="content" aria-busy="true">
      <section class="surface empty" data-i18n="正在读取 Antigravity 数据…">正在读取 Antigravity 数据…</section>
    </main>
    <footer><span id="source" data-i18n="数据来源 · Antigravity 本机">数据来源 · Antigravity 本机</span><time id="updated"></time></footer>
  </div>
  <script>/* JAVASCRIPT */</script>
</body>
</html>
