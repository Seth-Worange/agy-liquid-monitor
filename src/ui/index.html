<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>AGY Liquid Monitor</title>
  <style>/* CSS */</style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true"><i></i><i></i><i></i></span>
        <div><h1>Liquid Monitor</h1><p>Antigravity 用量监控</p></div>
      </div>
      <div class="actions">
        <span class="connection" id="connection" aria-live="polite">连接中</span>
        <button class="icon-button" id="theme" aria-label="切换主题" title="切换主题"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/><circle cx="12" cy="12" r="4"/></svg></button>
        <button class="icon-button" id="refresh" aria-label="刷新数据" title="刷新数据"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 7v5h-5M4.8 15.6a8 8 0 0 0 13.3 2.1M19.2 8.4A8 8 0 0 0 5.9 6.3L4 9"/></svg></button>
      </div>
    </header>
    <nav class="nav" aria-label="监控面板">
      <button data-view="overview" class="selected" aria-current="page">概览</button>
      <button data-view="session">会话</button>
      <button data-view="context">上下文</button>
      <button data-view="agents">子代理</button>
      <button data-view="quota">额度</button>
      <button data-view="usage">历史用量</button>
    </nav>
    <main id="content" aria-busy="true">
      <section class="surface empty">正在读取 Antigravity 数据…</section>
    </main>
    <footer><span id="source">数据来源 · Antigravity 本机</span><time id="updated"></time></footer>
  </div>
  <script>/* JAVASCRIPT */</script>
</body>
</html>
